version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ['*']
    # CLAUDE.md pins these: @cloudflare/vitest-plugin 1.3.x needs vitest ^4.1.
    ignore:
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
