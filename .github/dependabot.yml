version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Better Auth and its peers must move together (CLAUDE.md); keep them out of the big group.
      better-auth:
        patterns: ['better-auth', '@better-auth/*', 'better-call', '@better-fetch/fetch']
      npm-dependencies:
        patterns: ['*']
    ignore:
      # Major vitest upgrades are done by hand with the full test suite (CLAUDE.md).
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      # better-call's version is fixed by Better Auth's peer range; Dependabot proposed 2.x while Better Auth needs 1.4.x.
      - dependency-name: better-call
        update-types: ['version-update:semver-major']
      # Types follow the Node.js runtime (24), not the newest Node.js release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
