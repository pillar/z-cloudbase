name: Release

# Push a tag such as v0.2.1: builds the SDK tarballs for @z-cloudbase/web and @z-cloudbase/server
# and STAGES them on npm via trusted publishing (GitHub OIDC, no token), then attaches the tarballs to a GitHub
# release. Each package lists pillar/z-cloudbase + release.yml as its Trusted Publisher (direct publish not allowed);
# a maintainer publishes with `npm stage list @z-cloudbase/web` and `npm stage approve <id>` (2FA).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the versions
        run: |
          node -e '
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const read = (f) => JSON.parse(require("fs").readFileSync(f, "utf8")).version;
            const found = { root: read("package.json"), web: read("packages/sdk-web/package.json"), server: read("packages/sdk-server/package.json") };
            const bad = Object.entries(found).filter(([, x]) => x !== v);
            if (bad.length) { console.error("tag " + v + " differs from", JSON.stringify(found)); process.exit(1); }
          '
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm sdk:pack
      - name: Stage on npm (approve with 2FA to publish)
        run: |
          npm install -g npm@11.19.0
          for tarball in dist-sdk/*.tgz; do
            npm stage publish "./$tarball" --access public
          done
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist-sdk/*.tgz
          generate_release_notes: true
