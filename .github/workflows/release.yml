name: Release

# Push a tag such as v0.2.0: builds the SDK tarballs, publishes @z-cloudbase/web and @z-cloudbase/server
# to npm (with provenance; needs the NPM_TOKEN repository secret) and attaches the tarballs to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the versions
        run: |
          node -e '
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const read = (f) => JSON.parse(require("fs").readFileSync(f, "utf8")).version;
            const found = { root: read("package.json"), web: read("packages/sdk-web/package.json"), server: read("packages/sdk-server/package.json") };
            const bad = Object.entries(found).filter(([, x]) => x !== v);
            if (bad.length) { console.error("tag " + v + " differs from", JSON.stringify(found)); process.exit(1); }
          '
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm sdk:pack
      - name: Publish to npm
        run: |
          for tarball in dist-sdk/*.tgz; do
            npm publish "./$tarball" --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist-sdk/*.tgz
          generate_release_notes: true
